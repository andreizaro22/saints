<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAINTS - Gestiune Gang Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(10, 10, 12, 0.75), rgba(10, 10, 12, 0.85)), 
                        url('https://i.imgur.com/IGsi2Du.png') center/cover no-repeat fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
        }

        .grunge-card {
            background: rgba(23, 25, 29, 0.88);
            backdrop-filter: blur(8px);
            border: 2px solid #52473f;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(184, 115, 51, 0.15);
        }

        .grunge-input {
            background: rgba(18, 20, 24, 0.9);
            border: 1px solid #4a4039;
            color: #d1d5db;
        }
        .grunge-input:focus {
            outline: none;
            border-color: #8c6d53;
            box-shadow: 0 0 8px rgba(140, 109, 83, 0.4);
        }

        .btn-industrial {
            background: linear-gradient(180deg, #3a4149 0%, #22262b 100%);
            border: 1px solid #5a636e;
            color: #e2e8f0;
            transition: all 0.2s ease;
        }
        .btn-industrial:hover {
            background: linear-gradient(180deg, #48525d 0%, #2c3239 100%);
            border-color: #8c6d53;
            color: #ffffff;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121418; }
        ::-webkit-scrollbar-thumb { background: #3a4149; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <script>
        const BIN_ID = "6a898957f5f4af5e2934f86d"; 
        const API_KEY = "$2a$10$aPwopjOmD8yFh81DGxcfAOdM5uU6mrft6qab1tCZ87y8jWoHCqFGm";
        const COD_GANG_INREGISTRARE = "1122"; // Codul necesar pentru ca un membru nou să se poată înregistra

        let members = [];
        let orders = [];
        let currentUser = { name: "", role: "", isElJefe: false, isCustomManager: false };

        const defaultMembers = [
            { id: "m_1", name: "John Wayne", cnp: "1001", rank: "El Jefe", pass: "1122", isManager: true, actions: [] }
        ];

        async function loadData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const result = await response.json();
                
                if (result.record) {
                    members = result.record.members || defaultMembers;
                    orders = result.record.orders || [];
                }
            } catch(e) {
                console.error("Eroare la citire cloud:", e);
                members = defaultMembers;
            }
        }

        async function saveData() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ members: members, orders: orders })
                });
            } catch(e) {
                console.error("Eroare la salvare cloud:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadData();

            try {
                const savedUser = localStorage.getItem('saints_current_user_v5');
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                }
            } catch(e) {}

            if (currentUser && currentUser.name) {
                const found = members.find(m => m.name === currentUser.name);
                if (found) {
                    currentUser = {
                        name: found.name,
                        role: found.rank,
                        isElJefe: (found.rank === 'El Jefe' || !!found.isManager),
                        isCustomManager: !!found.isManager
                    };
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    updateBadge();
                    renderMembers();
                    renderLeaderboard();
                }
            }
        });

        function updateBadge() {
            let badgeText = `Autentificat: ${currentUser.name} [${currentUser.role}]`;
            if (currentUser.isElJefe) badgeText += ' (Boss / Manager)';
            document.getElementById('user-badge').innerText = badgeText;
        }

        window.dbRef = {
            async addMember(memberData) {
                const newMember = { id: 'm_' + Date.now() + Math.random().toString(36).substring(2, 5), ...memberData };
                members.push(newMember);
                await saveData();
                renderMembers();
                renderLeaderboard();
                return newMember;
            },
            async updateMember(docId, updatedData) {
                let m = members.find(item => item.id == docId);
                if (m) {
                    Object.assign(m, updatedData);
                    if (currentUser && currentUser.name === m.name) {
                        currentUser.role = m.rank;
                        currentUser.isElJefe = (m.rank === 'El Jefe' || !!m.isManager);
                        currentUser.isCustomManager = !!m.isManager;
                    }
                    await saveData();
                    renderMembers();
                    renderLeaderboard();
                }
            },
            async deleteMemberDoc(docId) {
                members = members.filter(item => item.id != docId);
                await saveData();
                renderMembers();
                renderLeaderboard();
            },
            async addOrder(orderData) {
                const newOrder = { id: 'o_' + Date.now() + Math.random().toString(36).substring(2, 5), ...orderData };
                orders.push(newOrder);
                await saveData();
                renderOrders();
            },
            async deleteOrderDoc(docId) {
                orders = orders.filter(item => item.id != docId);
                await saveData();
                renderOrders();
            }
        };

        window.appState = {
            getMembers: () => members,
            getOrders: () => orders,
            getCurrentUser: () => currentUser,
            setCurrentUser: (u) => { 
                currentUser = u; 
                if (currentUser && currentUser.name) {
                    localStorage.setItem('saints_current_user_v5', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('saints_current_user_v5');
                }
            }
        };
    </script>

    <!-- ECRAN LOGIN -->
    <div id="login-screen" class="w-full max-w-md grunge-card rounded-xl p-8 transition-all">
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="w-16 h-16 rounded-full bg-[#2a2420] border border-[#6b5545] flex items-center justify-center mb-3 shadow-inner">
                <i class="fa-solid fa-users-gear text-2xl text-[#b8860b]"></i>
            </div>
            <h1 class="text-3xl font-black tracking-widest text-gray-100 uppercase">SAINTS</h1>
            <p class="text-xs text-gray-400 font-semibold tracking-wider mt-1 uppercase">Acces Gang</p>
        </div>

        <div id="auth-forms" class="w-full">
            <div class="grid grid-cols-2 gap-2 mb-6 bg-[#121418] p-1 rounded-lg border border-gray-800">
                <button type="button" id="tab-btn-login" onclick="switchAuthMode('login')" class="py-2 text-xs font-bold rounded-md bg-[#2b3036] text-white transition cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Autentificare
                </button>
                <button type="button" id="tab-btn-register" onclick="switchAuthMode('register')" class="py-2 text-xs font-bold rounded-md text-gray-400 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-user-plus mr-1"></i> Înregistrare
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 text-center">Nume IC</label>
                    <input type="text" id="login-name" required placeholder="Ex: John Wayne" class="w-full px-4 py-3 rounded-lg grunge-input text-lg font-bold text-center text-white mb-4">
                    
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 text-center">Parola Ta Personală</label>
                    <input type="password" id="login-pass" required placeholder="****" class="w-full px-4 py-3 rounded-lg grunge-input text-lg font-bold text-center text-amber-500 tracking-widest">
                    
                    <p id="login-error" class="text-red-500 text-xs font-bold mt-3 text-center hidden">Nume sau parolă incorectă!</p>
                </div>

                <button type="submit" class="w-full py-3 mt-4 rounded-lg btn-industrial font-bold text-sm tracking-wider uppercase flex items-center justify-center gap-2 shadow-lg">
                    <span>Intră în Panou</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Nume IC</label>
                    <input type="text" id="reg-name" required placeholder="Ex: John Wayne" class="w-full px-3 py-2 rounded-lg grunge-input text-sm font-semibold">

                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">ID Joc (CNP)</label>
                    <input type="number" id="reg-cnp" required placeholder="Ex: 12345" class="w-full px-3 py-2 rounded-lg grunge-input text-sm font-mono">

                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Grad Gang</label>
                    <select id="reg-rank" class="w-full px-3 py-2 rounded-lg grunge-input text-sm cursor-pointer">
                        <option value="Associate">Associate</option>
                        <option value="Dealer">Dealer</option>
                        <option value="Veteran">Veteran</option>
                        <option value="Matroană">Matroană</option>
                        <option value="Consilier OG">Consilier OG</option>
                        <option value="Right Hand">Right Hand</option>
                        <option value="El Jefe">El Jefe</option>
                    </select>

                    <label class="block text-xs font-bold text-amber-500 uppercase tracking-wider mt-2 mb-1">Setează Parola Ta Personală</label>
                    <input type="password" id="reg-user-pass" required placeholder="Parola cu care te vei loga" class="w-full px-3 py-2 rounded-lg grunge-input text-sm font-bold text-amber-400">

                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mt-2 mb-1">Cod Gang Acces (1122)</label>
                    <input type="password" id="reg-gang-code" required placeholder="Codul secret al gangului" class="w-full px-3 py-2 rounded-lg grunge-input text-sm font-mono">
                </div>

                <button type="submit" class="w-full py-3 mt-2 rounded-lg btn-industrial font-bold text-sm tracking-wider uppercase flex items-center justify-center gap-2 shadow-lg">
                    <span>Creează Cont</span>
                    <i class="fa-solid fa-user-check"></i>
                </button>
                
                <p id="reg-success" class="text-green-500 text-xs font-bold mt-2 text-center hidden">Cont creat! Te poți loga acum.</p>
            </form>
        </div>
    </div>

    <!-- PANOUL PRINCIPAL -->
    <div id="dashboard-screen" class="hidden w-full max-w-6xl grunge-card rounded-xl p-6 my-6 transition-all">
        <div class="flex flex-col md:flex-row justify-between items-center pb-6 border-b border-gray-700 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-[#2a2420] border border-[#6b5545] flex items-center justify-center">
                    <i class="fa-solid fa-shield-halved text-amber-500"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-100 tracking-wider">SAINTS PANEL</h2>
                    <p id="user-badge" class="text-xs text-amber-500 font-medium"></p>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-2 bg-[#121418] p-1.5 rounded-lg border border-gray-800">
                <button onclick="switchTab('members')" id="btn-tab-members" class="px-4 py-2 text-xs font-bold rounded-md bg-[#2b3036] text-white transition">
                    <i class="fa-solid fa-users mr-1"></i> Membri
                </button>
                <button onclick="switchTab('leaderboard')" id="btn-tab-leaderboard" class="px-4 py-2 text-xs font-bold rounded-md text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-trophy mr-1 text-amber-500"></i> Clasament
                </button>
                <button onclick="switchTab('orders')" id="btn-tab-orders" class="px-4 py-2 text-xs font-bold rounded-md text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-boxes-stacked mr-1 text-blue-400"></i> Comenzi
                </button>
            </div>

            <div class="flex items-center gap-3">
                <button id="btn-reset" onclick="resetWeeklyData()" class="px-3 py-2 bg-red-950/80 border border-red-800 text-red-300 hover:bg-red-900 text-xs font-bold rounded-lg transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Reset Săptămânal
                </button>
                <button onclick="logout()" class="px-3 py-2 btn-industrial text-xs font-bold rounded-lg" title="Deconectare">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>

        <!-- TAB MEMBRI -->
        <div id="section-members" class="mt-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Evidență Membri</h3>
                <div class="flex flex-wrap gap-2">
                    <button id="btn-set-manager" onclick="openManagerModal()" class="px-3 py-1.5 bg-amber-950/80 border border-amber-800 text-amber-300 hover:bg-amber-900 text-xs font-bold rounded-lg shadow-lg transition">
                        <i class="fa-solid fa-user-shield mr-1"></i> Setează Manager
                    </button>
                    <button id="btn-add-member" onclick="openAddModal()" class="px-3 py-1.5 btn-industrial text-xs font-bold rounded-lg shadow-lg">
                        <i class="fa-solid fa-user-plus mr-1"></i> Adaugă Membru
                    </button>
                </div>
            </div>

            <div id="members-table-wrapper" class="overflow-x-auto rounded-lg border border-gray-800 shadow-xl bg-[#121418]">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-[#121418] text-xs uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="py-3 px-4">Nume IC</th>
                            <th class="py-3 px-4">Grad Gang</th>
                            <th class="py-3 px-4">Istoric Acțiuni</th>
                            <th class="py-3 px-4 text-center">Total</th>
                            <th class="py-3 px-4 text-right">Acțiuni / Setări</th>

                    </thead>
                    <tbody id="members-table-body" class="divide-y divide-gray-800/60 bg-black/30"></tbody>
                </table>
            </div>
        </div>

        <!-- LEADERBOARD TAB -->
        <div id="section-leaderboard" class="mt-6 hidden">
            <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider mb-6 text-center">Cei mai activi membri</h3>
            <div id="podium-container" class="flex flex-col md:flex-row justify-center items-end gap-4 mb-8 min-h-[160px]"></div>
        </div>

        <!-- ORDERS TAB -->
        <div id="section-orders" class="mt-6 hidden">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Comenzi Active</h3>
                <button onclick="openOrderModal()" class="px-3 py-1.5 btn-industrial text-xs font-bold rounded-lg shadow-lg">
                    <i class="fa-solid fa-cart-plus mr-1"></i> Adaugă Comandă
                </button>
            </div>
            <div class="overflow-x-auto rounded-lg border border-gray-800 shadow-xl">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-[#121418] text-xs uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="py-3 px-4">Client</th>
                            <th class="py-3 px-4">Detalii</th>
                            <th class="py-3 px-4 text-center">Cantitate</th>
                            <th class="py-3 px-4 text-right">Status</th>

                    <tbody id="orders-table-body" class="divide-y divide-gray-800/60 bg-black/30"></tbody>

    <!-- MODAL -->
    <div id="custom-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-[#17191d] border-2 border-[#52473f] rounded-xl p-6 max-w-sm w-full shadow-[0_0_35px_rgba(0,0,0,0.9)]">
            <h3 id="modal-title" class="text-lg font-bold text-gray-200 mb-2 uppercase tracking-wider">Titlu</h3>
            <p id="modal-desc" class="text-sm text-gray-400 mb-4">Descriere</p>
            <div id="modal-inputs" class="space-y-3 mb-6 hidden"></div>
            <div class="flex justify-end gap-3 mt-6">
                <button id="modal-btn-cancel" onclick="closeModal()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-bold rounded-lg transition hidden">Anulează</button>
                <button id="modal-btn-confirm" class="px-4 py-2 btn-industrial text-sm font-bold rounded-lg transition">Confirmă</button>
            </div>
        </div>
    </div>

    <script>
        function switchAuthMode(mode) {
            if (mode === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-form').classList.add('hidden');
            } else {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const cnp = document.getElementById('reg-cnp').value.trim();
            const rank = document.getElementById('reg-rank').value;
            const userPass = document.getElementById('reg-user-pass').value.trim();
            const gangCode = document.getElementById('reg-gang-code').value.trim();

            if (gangCode !== COD_GANG_INREGISTRARE) {
                showModal({ title: 'Eroare Securitate', message: 'Codul de acces al gangului este incorect! Cere codul de la El Jefe.', type: 'alert' });
                return;
            }

            if (!name || !cnp || !userPass) return;

            const exista = members.find(m => m.name.toLowerCase() === name.toLowerCase());
            if (exista) {
                showModal({ title: 'Eroare', message: 'Există deja un membru înregistrat cu acest nume!', type: 'alert' });
                return;
            }

            await window.dbRef.addMember({
                name: name,
                cnp: cnp,
                rank: rank,
                pass: userPass,
                actions: []
            });

            document.getElementById('reg-success').classList.remove('hidden');
            setTimeout(() => { 
                switchAuthMode('login'); 
                document.getElementById('login-name').value = name; 
                document.getElementById('reg-success').classList.add('hidden');
            }, 1500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errorEl = document.getElementById('login-error');

            errorEl.classList.add('hidden');

            const foundMember = members.find(m => m.name.toLowerCase() === name.toLowerCase());

            if (!foundMember) {
                errorEl.innerText = "Numele nu a fost găsit. Mergi la Înregistrare mai întâi!";
                errorEl.classList.remove('hidden');
                return;
            }

            if (foundMember.pass && foundMember.pass !== pass) {
                errorEl.innerText = "Parola introduse este greșită!";
                errorEl.classList.remove('hidden');
                return;
            }

            currentUser = { 
                name: foundMember.name, 
                role: foundMember.rank, 
                isElJefe: (foundMember.rank === 'El Jefe' || !!foundMember.isManager), 
                isCustomManager: !!foundMember.isManager 
            };
            
            window.appState.setCurrentUser(currentUser);
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            updateBadge();
            renderMembers();
            renderLeaderboard();
        }

        function logout() {
            localStorage.removeItem('saints_current_user_v5');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-pass').value = '';
            window.appState.setCurrentUser({ name: "", role: "", isElJefe: false, isCustomManager: false });
        }

        function switchTab(tab) {
            ['members', 'leaderboard', 'orders'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`btn-tab-${t}`).classList.replace('bg-[#2b3036]', 'text-gray-400');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-tab-${tab}`).classList.add('bg-[#2b3036]');
            if (tab === 'leaderboard') renderLeaderboard();
            if (tab === 'orders') renderOrders();
        }

        function getTotalActions(member) {
            if (!member.actions) return 0;
            return member.actions.reduce((sum, a) => sum + a.count, 0);
        }

        function renderMembers() {
            const tbody = document.getElementById('members-table-body');
            tbody.innerHTML = '';
            const canManage = currentUser.isElJefe || currentUser.isCustomManager || ['Right Hand', 'Consilier OG'].includes(currentUser.role);
            
            document.getElementById('btn-add-member').style.display = canManage ? 'inline-block' : 'none';
            document.getElementById('btn-reset').style.display = canManage ? 'inline-block' : 'none';
            document.getElementById('btn-set-manager').style.display = currentUser.isElJefe ? 'inline-block' : 'none';

            members.forEach(m => {
                const total = getTotalActions(m);
                let actionsHTML = m.actions?.map(a => `<span class="bg-black/50 px-2 py-1 rounded text-[10px] border border-amber-900/40 text-amber-500">${a.actionName}: <span class="text-white">${a.count}</span></span>`).join(' ') || '-';
                
                let btns = canManage ? `
                    <button onclick="logAction('${m.id}')" class="px-2 py-1 bg-green-950/60 border border-green-800 text-green-400 hover:bg-green-900 rounded text-xs mr-1" title="Adaugă acțiune"><i class="fa-solid fa-plus"></i></button>
                    <button onclick="reduceAction('${m.id}')" class="px-2 py-1 bg-amber-950/60 border border-amber-800 text-amber-400 hover:bg-amber-900 rounded text-xs mr-2" title="Scade/Modifică acțiune"><i class="fa-solid fa-minus"></i></button>
                    <button onclick="deleteMember('${m.id}')" class="px-2 py-1 bg-red-950/60 border border-red-800 text-red-400 hover:bg-red-900 rounded text-xs" title="Șterge membru"><i class="fa-solid fa-trash"></i></button>
                ` : `<span class="text-xs text-gray-600">Doar vizualizare</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 border-t border-gray-800/50">
                        <td class="py-3 px-4 font-semibold">${m.name} <div class="text-[10px] text-gray-500">ID: ${m.cnp} ${m.isManager ? '[MANAGER]' : ''}</div></td>
                        <td class="py-3 px-4 text-xs text-amber-500 font-bold">${m.rank}</td>
                        <td class="py-3 px-4">${actionsHTML}</td>
                        <td class="py-3 px-4 text-center font-bold text-amber-400">${total}</td>
                        <td class="py-3 px-4 text-right">${btns}</td>
                    </tr>
                `;
            });
        }

        function renderOrders() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';
            orders.forEach(o => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 border-t border-gray-800/50">
                        <td class="py-3 px-4 font-bold">${o.name} <div class="text-[10px] text-gray-500">CNP: ${o.cnp} | Tel: ${o.phone}</div></td>
                        <td class="py-3 px-4">${o.details}</td>
                        <td class="py-3 px-4 text-center font-bold text-amber-400">${o.quantity}</td>
                        <td class="py-3 px-4 text-right">
                            <button onclick="window.dbRef.deleteOrderDoc('${o.id}')" class="px-2 py-1 bg-green-900/30 border border-green-800 text-green-400 rounded text-xs">Finalizat</button>
                        </td>
                    </tr>
                `;
            });
        }

        function renderLeaderboard() {
            const podium = document.getElementById('podium-container');
            podium.innerHTML = '';
            const sorted = [...members].sort((a, b) => getTotalActions(b) - getTotalActions(a));
            if (sorted[0]) podium.innerHTML += `<div class="bg-[#121418] border-2 border-amber-500 p-4 rounded-xl text-center min-w-[200px]"><h4 class="text-xl font-bold">${sorted[0].name}</h4><p class="text-amber-500 font-bold mt-1">${getTotalActions(sorted[0])} Acțiuni</p></div>`;
        }

        function logAction(id) {
            const m = members.find(item => item.id == id);
            showModal({
                title: `Adaugă activitate pentru ${m.name}`, type: 'prompt',
                inputs: [{ id: 'numeA', label: 'Tip acțiune (Ex: Craft, Tura, Rob)' }, { id: 'nrA', label: 'Câte adaugi?', type: 'number', value: 1 }],
                onConfirm: async (vals) => {
                    let actionsArr = m.actions || [];
                    let existing = actionsArr.find(a => a.actionName.toLowerCase() === vals.numeA.toLowerCase());
                    if (existing) existing.count += parseInt(vals.nrA);
                    else actionsArr.push({ actionName: vals.numeA, count: parseInt(vals.nrA) });
                    await window.dbRef.updateMember(id, { actions: actionsArr });
                }
            });
        }

        function reduceAction(id) {
            const m = members.find(item => item.id == id);
            if (!m.actions || m.actions.length === 0) {
                showModal({ title: 'Atenție', message: 'Acest membru nu are nicio activitate de scăzut.', type: 'alert' });
                return;
            }
            showModal({
                title: `Scade/Șterge activitate la ${m.name}`, type: 'prompt',
                inputs: [
                    { id: 'numeA', label: 'Numele acțiunii de scăzut' }, 
                    { id: 'nrA', label: 'Câte scazi?', type: 'number', value: 1 }
                ],
                onConfirm: async (vals) => {
                    let actionsArr = m.actions || [];
                    let existing = actionsArr.find(a => a.actionName.toLowerCase() === vals.numeA.toLowerCase());
                    if (existing) {
                        existing.count -= parseInt(vals.nrA);
                        if (existing.count <= 0) {
                            actionsArr = actionsArr.filter(a => a.actionName.toLowerCase() !== vals.numeA.toLowerCase());
                        }
                        await window.dbRef.updateMember(id, { actions: actionsArr });
                    } else {
                        showModal({ title: 'Eroare', message: 'Nu s-a găsit o acțiune cu acest nume la membrul respectiv!', type: 'alert' });
                    }
                }
            });
        }

        function deleteMember(id) {
            showModal({ title: 'Confirmare', message: 'Ești sigur că vrei să ștergi definitiv acest membru?', type: 'confirm', onConfirm: () => window.dbRef.deleteMemberDoc(id) });
        }

        function openAddModal() {
            showModal({
                title: 'Adaugă Membru Nou', type: 'prompt',
                inputs: [
                    { id: 'n', label: 'Nume IC' }, 
                    { id: 'c', label: 'CNP/ID' }, 
                    { id: 'r', label: 'Grad', type: 'select', options: ['Associate', 'Dealer', 'Veteran', 'Matroană', 'Consilier OG', 'Right Hand', 'El Jefe'] },
                    { id: 'p', label: 'Parolă Inițială', value: '1234' }
                ],
                onConfirm: async (v) => await window.dbRef.addMember({ name: v.n, cnp: v.c, rank: v.r, pass: v.p, actions: [] })
            });
        }

        function openOrderModal() {
            showModal({
                title: 'Comandă Nouă', type: 'prompt',
                inputs: [{ id: 'n', label: 'Nume Client' }, { id: 'c', label: 'CNP' }, { id: 'p', label: 'Telefon' }, { id: 'd', label: 'Detalii comanda' }, { id: 'q', label: 'Cantitate' }],
                onConfirm: async (v) => await window.dbRef.addOrder({ name: v.n, cnp: v.c, phone: v.p, details: v.d, quantity: v.q })
            });
        }

        function resetWeeklyData() {
            showModal({
                title: 'Reset Săptămânal', message: 'Se vor șterge toate acțiunile adunate ale membrilor pentru a începe o nouă săptămână. Continui?', type: 'confirm', 
                onConfirm: async () => { for (let m of members) await window.dbRef.updateMember(m.id, { actions: [] }); }
            });
        }

        function openManagerModal() {
            showModal({
                title: 'Setează Manager', type: 'prompt', inputs: [{ id: 'c', label: 'CNP Membru' }],
                onConfirm: async (v) => { const m = members.find(x => x.cnp === v.c); if(m) await window.dbRef.updateMember(m.id, { isManager: true }); }
            });
        }

        function showModal(opt) {
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = opt.title;
            document.getElementById('modal-desc').innerText = opt.message || '';
            const inp = document.getElementById('modal-inputs');
            inp.innerHTML = '';
            if (opt.type === 'prompt') {
                inp.classList.remove('hidden');
                opt.inputs.forEach(i => {
                    if (i.type==='select') inp.innerHTML += `<div><label class="text-xs text-gray-400 mb-1 block">${i.label}</label><select id="mi-${i.id}" class="w-full px-2 py-1.5 rounded grunge-input text-sm">${i.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
                    else inp.innerHTML += `<div><label class="text-xs text-gray-400 mb-1 block">${i.label}</label><input type="${i.type||'text'}" id="mi-${i.id}" value="${i.value||''}" class="w-full px-2 py-1.5 rounded grunge-input text-sm"></div>`;
                });
            } else inp.classList.add('hidden');
            
            document.getElementById('modal-btn-cancel').classList.toggle('hidden', opt.type === 'alert');
            document.getElementById('modal-btn-confirm').onclick = () => {
                if(opt.type==='prompt'){ let v={}; opt.inputs.forEach(i=>v[i.id]=document.getElementById(`mi-${i.id}`).value); closeModal(); opt.onConfirm(v); }
                else { closeModal(); if(opt.onConfirm) opt.onConfirm(); }
            };
        }

        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }
    </script>
</body>
</html>
